services:
  - type: web
    name: verserag-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: LLM_PROVIDER
        value: huggingface
      - key: HF_MODEL
        value: Qwen/Qwen2.5-7B-Instruct-1M:fastest
      - key: EMBEDDING_PROVIDER
        value: huggingface
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: verserag-frontend
    runtime: static
    rootDir: frontend
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: verserag-api
          envVarKey: RENDER_EXTERNAL_URL
